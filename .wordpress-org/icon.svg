  <rect x="84.4" y="97.3" width="52.6" height="8.7" rx="4.35" fill="#D6DEEE"/>
  <rect x="84.4" y="117.9" width="27.9" height="8.7" rx="4.35" fill="#D6DEEE"/>

  <!-- Email badge -->
  <circle cx="174.4" cy="165.6" r="39.7" fill="#00C2A8"/>
  <rect x="153.4" y="151.1" width="42" height="29" rx="4.5" fill="#FFFFFF"/>
